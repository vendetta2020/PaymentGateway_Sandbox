services:
  postgres:
    image: postgres:16-alpine
    container_name: pg-payment-gateway
    environment:
      POSTGRES_USER: ${DB_USERNAME:-paymentgw}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-paymentgw_secret}
      POSTGRES_DB: ${DB_NAME:-payment_gateway}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-paymentgw} -d ${DB_NAME:-payment_gateway}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app-payment-gateway
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-paymentgw}
      DB_PASSWORD: ${DB_PASSWORD:-paymentgw_secret}
      DB_NAME: ${DB_NAME:-payment_gateway}
      ALLOW_DEV_CREDENTIAL_PROVISIONING: 'true'
      ALLOW_DEV_PAYMENT_SIMULATION: 'true'
      ALLOW_DEV_WEBHOOK_DELIVERY: 'true'
      ALLOW_DEV_LOCAL_WEBHOOKS: 'true'
    ports:
      - '3005:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3005/api/v1
        NEXT_PUBLIC_ENVIRONMENT: TEST
    container_name: web-payment-gateway
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_INTERNAL_URL: http://backend:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3005/api/v1
      NEXT_PUBLIC_ENVIRONMENT: TEST
    ports:
      - '3001:3000'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
