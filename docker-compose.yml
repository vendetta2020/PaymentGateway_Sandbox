services:
  postgres:
    image: postgres:16-alpine
    container_name: pg-payment-gateway
    environment:
      POSTGRES_USER: paymentgw
      POSTGRES_PASSWORD: paymentgw_secret
      POSTGRES_DB: payment_gateway
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paymentgw -d payment_gateway']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
